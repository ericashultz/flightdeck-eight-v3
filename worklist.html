<!doctype html>
<html lang="en">
<head>
<script src="/gate.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flight Deck &middot; Status &middot; Bttr.</title>
<style>
  @font-face{font-family:"GE Sans";font-weight:400;font-display:swap;src:url("assets/fonts/ge-sans/sons-regular.woff2") format("woff2")}
  @font-face{font-family:"GE Sans";font-weight:600;font-display:swap;src:url("assets/fonts/ge-sans/sons-semibold.woff2") format("woff2")}
  :root{--ink:#00003d;--muted:#4A506A;--line:#e7ebf4;--soft:#eef1f8;--cap:#3d3d63;
    --blue:#146FF8;--green:#00B140;--amber:#8a6100;--today:#C9A227;--dim:#8891ab;
    --sans:"GE Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:#e9eaf0;line-height:1.35;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
  header{padding:clamp(20px,2.4vh,32px) 34px 0;flex:none;background:#e9eaf0}
  .eyebrow{margin-bottom:16px}
  h1{font-weight:400;font-size:clamp(29px,3.4vw,44px);letter-spacing:-.025em;line-height:1.04}

  .stats{display:flex;margin-top:clamp(16px,2vh,24px);border-top:1px solid var(--line);background:#fff}
  .st{flex:1;min-width:0;padding:14px 18px 15px;border-left:1px solid var(--line)}
  .st:first-child{border-left:0}
  .st .k{margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st .v{font-size:clamp(16px,1.25vw,21px);font-weight:400;letter-spacing:-.025em;line-height:1.15}
  .st .v small{font-size:13px;color:var(--muted);letter-spacing:0}
  .st.ship .v{color:var(--green)} .st.blocked .v{color:var(--amber)} .st.now .v{color:var(--blue)}

  /* The standup opener: what is going on, in the time it takes to look up. */
  .tldr{background:var(--ink);color:#fff;padding:46px 40px 48px;border-radius:14px;box-shadow:0 1px 2px rgba(11,26,64,.05),0 18px 40px -26px rgba(11,26,64,.30)}
  .tldr .hl{font-size:26px;font-weight:400;letter-spacing:-.015em;line-height:1.2;max-width:76ch;text-wrap:balance}
  .tldr ul{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 56px;margin-top:30px;max-width:112ch}
  /* Three points sit three across, so the row does not end on an empty cell. */
  .tldr ul.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 40px;max-width:none}
  .tldr li{font-size:14px;line-height:1.55;color:#cbd5e1;padding-left:15px;position:relative}
  .tldr .tlinks{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
  .tldr .tlinks a{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;
    font-size:13.5px;border:1px solid rgba(255,255,255,.22);border-radius:100px;padding:9px 18px;
    transition:border-color .16s,background .16s}
  .tldr .tlinks a:hover{border-color:#16b364;background:rgba(22,179,100,.12)}
  .tldr .tlinks a span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(255,255,255,.5)}
  .tldr li:before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:#7eacff}
  .tldr li .tl-review{color:#16b364;text-decoration:none;font-weight:600;white-space:nowrap;margin-left:6px}
  .tldr li .tl-review:hover{text-decoration:underline}
  .tldr .tl-films{display:grid;gap:8px;margin:10px 0 4px}
  .tldr .tl-films a{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 14px;transition:border-color .15s,background .15s}
  .tldr .tl-films a:hover{border-color:#16b364;background:rgba(22,179,100,.10)}
  .tldr .tl-films b{font-weight:600;font-size:14px}
  .tldr .tl-films span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8fa0d0}
  .tldr .tl-films i{margin-left:auto;font-style:normal;color:#16b364}

  /* Three parts, each its own block: the dates, what they mean, the work. */
  .listwrap{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(11,26,64,.05), 0 18px 40px -26px rgba(11,26,64,.22)}
  /* Next week is its own card, built on .gatesblock's shell rather than a new one: white
     panel, 1px line, same radius and shadow, .blockhd for the label. A second dark block
     under the status card read as a continuation of it, which is why it needed a divider. */
  .nwblock{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
    box-shadow:0 1px 2px rgba(11,26,64,.05), 0 18px 40px -26px rgba(11,26,64,.22)}
  /* One column, in date order, each day named once. Two columns meant Mon 17 appeared
     three times in two places and the eye had to rebuild the sequence. */
  .nwblock ul{list-style:none;padding:10px 0 12px;border-top:1px solid var(--line);margin-top:14px}
  .nwblock>ul>li{display:flex;gap:14px;align-items:baseline;padding:5px 18px}
  /* The date is the column you scan, so it is fixed width and every title starts at the
     same x whether the day is Mon or Wed. */
  .nwblock b{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;
    color:var(--muted);flex:none;width:72px;padding-top:2px;white-space:nowrap}
  /* the week now runs past this Friday, so the day column has to hold
     "Tue Sep 8" and "Tue or Wed" on one line */
  .nwblock .day{flex:1;min-width:0;display:grid;gap:5px}
  .nwblock .day>span{display:flex;gap:12px;align-items:baseline;font-size:14px;
    line-height:1.5;color:var(--ink)}
  /* A day with more than one thing on it gets a hairline above, so the groups read apart. */
  .nwblock>ul>li+li{border-top:1px solid #f2f4fa;padding-top:9px;margin-top:4px}
  .gates{display:flex;gap:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 2px rgba(11,26,64,.05), 0 18px 40px -26px rgba(11,26,64,.22)}
  /* Chevrons rather than rules: the four gates are a sequence, not four
     separate cells, and the strip should read left to right. */
  .gt{flex:1;padding:16px 18px 17px;min-width:0;position:relative}
  .gt:not(:last-child)::after{content:"";position:absolute;right:-6px;top:50%;width:11px;height:11px;
    margin-top:-6px;border-top:1.5px solid #c9d0e2;border-right:1.5px solid #c9d0e2;
    transform:rotate(45deg);pointer-events:none}
  .tldr{margin-bottom:14px}
  .gt:first-child{border-left:0}
  .gt .d{margin-bottom:4px}
  .gt .l{font-size:13px;color:var(--muted);line-height:1.35}
  .gt.past{opacity:.38}
  /* The next gate is the only one that changes what you do today, so it does not
     sit at the same visual weight as the three behind it. */
  .gt.next{background:#fffdf3}
  .gt.next:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--today)}
  .gt.next .d{color:#8a6a00}
  .gt.next .l{color:var(--ink);font-weight:600}

  /* Each block says what it is, in the same mono eyebrow the dashboard uses
     for its sections. The dates and the read explain themselves; the list did not. */
  .blockhd{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    color:var(--cap);padding:16px 18px 0}
  .gatesblock{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;
    box-shadow:0 1px 2px rgba(11,26,64,.05), 0 18px 40px -26px rgba(11,26,64,.22)}
  .gatesblock .gates{border:0;border-radius:0;margin-bottom:0;box-shadow:none;border-top:1px solid var(--line);margin-top:14px}
  .tldr .blockhd{color:#8aa6f0;padding:0 0 14px}
  body.status-only .tldr,body.status-only .gatesblock,body.status-only .nwblock{display:none}
  #schedblock{padding:0}
  /* The embed fills the height it is given, so it gets a fixed one: the same as the hub's Schedule tab. */
  #schedframe{height:1000px}
  @media (max-width:900px){#schedframe{height:760px}}
  /* The one control row: label inline left, pills right, inside the panel. */
  .controls{display:flex;gap:24px;padding:13px 18px;flex-wrap:wrap;align-items:center;flex:none;border-bottom:1px solid var(--line)}
  .mkbtn{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:#1844cc;background:#eef2ff;border:1px solid #d7e0fb;border-radius:999px;padding:6px 14px;white-space:nowrap}
  .mkbtn:hover{background:#e2e9ff;border-color:#b9c9f7}
  .controls>div{display:flex;align-items:center;gap:10px}
  /* the one small-label style: same face and scale as the hub chrome around it */
  .eyebrow,.gl,.st .k,.gt .d{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--cap)}
  .gl{margin-bottom:0;white-space:nowrap}
  .opts{display:flex;gap:4px;flex-wrap:wrap}
  .vb{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;letter-spacing:-.005em;border:1px solid var(--line);background:#fff;
    border-radius:100px;padding:6px 13px;cursor:pointer;user-select:none;transition:.18s}
  .vb{font-family:inherit}
  .vb.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .vb input{display:none}
  .vb:hover{border-color:var(--ink)}
  .vb:has(input:checked){background:var(--ink);border-color:var(--ink);color:#fff}
  .vb .n{font-size:11px;opacity:.6;font-weight:400}

  main{flex:1;overflow-y:auto;padding:4px 34px 40px}
  .grp{margin-top:34px}
  .grp:first-child{margin-top:6px}
  /* No rule here: the table draws its own top edge, and the two stacked 2px apart. */
  .gh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .gh .gs{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .gh .ct{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;color:var(--muted)}
  .gh b{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .gh-link{text-decoration:none;color:inherit;border-bottom:1px solid transparent}
  .gh-link:hover{border-bottom-color:var(--ink)}

  /* One table per page group. Status is a pill, item carries its own note,
     owner and due sit right. Headers sort. */
  /* Inside the listwrap card already, so no border or radius of its own. */
  .wl{width:100%;border-collapse:collapse;background:#fff;table-layout:fixed}
  .wl th{text-align:left;padding:14px 18px;background:#fbfcfd;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
    color:var(--cap);cursor:pointer;user-select:none;white-space:nowrap}
  .wl th:hover{color:var(--ink)}
  .wl th .ar{margin-left:6px;font-size:9px;opacity:0}
  .wl th.on{color:var(--ink)}
  .wl th.on .ar{opacity:1}
  .wl td{padding:17px 18px;border-bottom:1px solid #f1f3f8;vertical-align:top}
  .wl tr:last-child td{border-bottom:0}
  .wl tbody tr:hover{background:#fbfcfe}
  .c-status{width:140px} .c-owner{width:110px;text-align:center} .c-due{width:104px;text-align:right}
  th.c-owner{text-align:center} th.c-due{text-align:right}
  .it-t{font-size:14px;font-weight:600;letter-spacing:-.005em;line-height:1.35}
  /* A linked item reads as the item, not as a link. The arrow is the only tell
     until you are on it, so a table of thirty of these stays a table. */
  a.it-a{display:inline;color:inherit;text-decoration:none}
  a.it-a:hover{color:var(--blue)}
  .it-go{margin-left:6px;font-size:11px;color:var(--dim);vertical-align:1px}
  a.it-a:hover .it-go{color:var(--blue)}
  a.it-a:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
  .it-n{font-size:13px;color:var(--muted);line-height:1.5;margin-top:3px}
  tr.done .it-t{font-weight:500;color:var(--muted)}
  tr.done .it-n{color:#4A506A}
  .pill{display:inline-block;padding:5px 13px;border-radius:999px;font-size:12.5px;font-weight:500;line-height:1.3;white-space:nowrap}
  .p-blocked{background:#fdf0da;color:#8a6100}
  .p-active{background:#e5eeff;color:#1a4fbf}
  .p-next{background:#efeaff;color:#4a2f8f}
  .p-shipped{background:#e0f5ea;color:#00782D}
  .p-sharepoint{background:#eef0f4;color:#4A506A}
  .own{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
    color:var(--cap);border:1px solid var(--line);border-radius:100px;padding:4px 10px;display:inline-block}
  .own.ge{background:#eef3ff;border-color:#d5e2ff;color:#1a3f8f}
  .due{font-size:13px;color:var(--muted);white-space:nowrap}
  .due.soon{color:var(--amber);font-weight:600}
  .due.none{color:#c3c7d2}
  .due.done{color:#00782D}
  .ref{font-family:var(--mono);font-size:10.5px;color:#b3b8c4;letter-spacing:.02em;margin-left:8px}
  .empty{padding:40px 2px;color:var(--muted);font-size:14px}
  .foot{padding:0 34px 22px;font-size:11.5px;color:var(--muted);letter-spacing:.2px}

  /* Embedded on the hub: the hub already says what this is. */
  /* Embedded, the page flows and the host sizes the frame to it. Standalone it
     is a full-height app with its own scroller; inside the hub that nests a
     scrollbar in a scrollbar and crops the table to whatever the frame was
     guessed to be. */
  html.embed{height:auto}
  body.embed{background:#f6f8fd;display:block;height:auto;overflow:visible;padding:0 0 2px}
  body.embed main{flex:none;overflow:visible}
  body.embed header{display:none}
  body.embed .controls{padding:15px 22px}
  body.embed main{padding:0 22px 26px}
  body.embed .listwrap{}
  body.embed .st{padding:11px 18px 12px}
  body.embed .tldr{padding:40px 30px 42px}
  body.embed .gates{}
  body.embed .gt{padding:15px 20px 16px}
  body.embed .foot{display:none}

  @media(max-width:820px){
    .tldr .hl{font-size:21px}
    .tldr ul,.tldr ul.three{grid-template-columns:1fr}
    .stats,.gates{flex-wrap:wrap}
    .st,.gt{flex:1 1 50%;border-top:1px solid var(--line)}
    .row{grid-template-columns:22px 1fr;gap:0 12px}
    .meta,.due{grid-column:2;padding-top:6px}
  }
.c-needs{width:150px;white-space:nowrap;text-align:center}
  .needs{font-family:var(--mono,ui-monospace,Menlo,monospace);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8a5a00;background:#fff6e5;border:1px solid #f3e0bd;border-radius:100px;padding:4px 10px;display:inline-block}
  .needs-none{color:#c8cede}
</style>
</head>
<body>

<header>
  <div class="eyebrow" id="eyebrow">Flight Deck</div>
  <h1>Status</h1>
  <div class="stats" id="stats"></div>
</header>
<!-- outside the header so the hub embed keeps both when it drops the title.
     The dates first, because where we are in the week frames everything under
     it, then what is going on. -->
<section class="gatesblock">
  <div class="blockhd">Dates</div>
  <div class="gates" id="gates"></div>
</section>
<div class="tldr" id="tldr"></div>
<!-- The Phase 3 schedule sits under the banner (Donny, 19 October): the banner says what is
     happening, the schedule shows when. Same page the Schedule tab opens, so the dates agree. -->
<section class="gatesblock" id="schedblock">
  <iframe id="schedframe" src="publication-timeline.html?embed=1" title="Phase 3 schedule" style="display:block;width:100%;border:0"></iframe>
</section>
<section class="nwblock" id="nwblock"></section>

<section class="listwrap">
  <div class="blockhd" style="display:flex;align-items:center;justify-content:space-between">
    <span>Status</span>
    <a class="mkbtn" href="https://app.markup.io/w/lKw606Ow/f/76bb7f1c-a3ae-4670-97c4-2441aca00688" target="_blank" rel="noopener">Open MarkUp &#8599;</a>
  </div>
  <div class="controls">
    <div>
      <div class="gl">Show</div>
      <div class="opts" id="f-status"></div>
    </div>
  </div>
  <main id="list"><div class="empty">Loading.</div></main>
</section>
<div class="foot" id="foot"></div>

<script>
(function(){
  var EMBED = /[?&]embed=1/.test(location.search);
  if (EMBED) { document.body.classList.add('embed');
    // html carries height:100% for the standalone app; embedded it has to
    // grow with the content or the host measures the frame it already set
    document.documentElement.classList.add('embed'); }

  /* The hub's Status tab wants the table alone. On All it sits under the
     summary and the dates, and repeating those inside a tab named Status only
     pushes the thing the tab is named for below the fold. */
  if (/[?&]only=status/.test(location.search)) document.body.classList.add('status-only');

  /* Say the state in the program's own terms. "In flight" and "Shipped" both
     read as "done-ish" and neither answers the question that matters: is it in
     SharePoint yet? Live in Prototype is the Vercel site awaiting GE sign off.
     In SharePoint is the only state that means GE's people can see it. */
  /* Every tag answers whose move it is and what is being asked. "Pending" hid
     that eleven items were GE's move; "Review" read as a state when it is a
     request. GE reads this board, so the labels have to carry the ask. */
  /* Chip order is the order of the ask: what GE can review, what we are on,
     what sits with them. No All chip — nothing selected already shows all,
     and clicking the selected chip clears it. */
  var STATUS = [
    { k:'blocked',    label:'From GE' },
    { k:'active',     label:'In progress' },
    { k:'shipped',    label:'Ready for review' },
    { k:'next',       label:'Queued' },
    { k:'sharepoint', label:'In SharePoint' }
  ];
  /* A group heading names a page, so it should open it. This file renders
     inside an iframe on the hub, so these must open in a new tab or they
     would load inside the frame. */
  var PAGE_URL = {
    'Action Planning': '/deliverables/action-planning/ap-concept-hybrid.1.html',
    'Standard Work':   '/deliverables/standard-work/sw-concept-hybrid.1.html',
    'Problem Solving': '/deliverables/problem-solving/ps-concept-hybrid.1.html'
  };
  var ORDER = { blocked:0, active:1, next:2, shipped:3, sharepoint:4 };
  var DONE = { shipped:1, sharepoint:1 };

  var today = new Date(); today.setHours(0,0,0,0);
  function parse(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function days(a,b){ return Math.round((b-a)/864e5); }
  function fmt(d){ return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
  function fmtShort(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* Opens on Ready to review. The board's first job is to show GE what is
     waiting on them to look at; the other two chips are one click away, and
     clicking the lit chip clears back to everything. */
  var DATA = null, fStatus = 'blocked';   /* opens on From GE: the shortest list, and the only one that asks anything */

  fetch('data/worklist.json', { cache:'no-store' })
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      DATA = d;
      /* SCOPE — the pages in flight, plus any page where GE owes a comment.
         Everything else stays in data/worklist.json and comes back by widening this
         list or emptying it.
         Widened 24 August: Standard Work and Problem Solving publish on the 25th, 5S
         and Daily & Visual Management on 1 September, and Operating Cadences and
         Daily & Visual Management were carrying seven open comments while scoped off
         the board. A page GE owes a comment on cannot be hidden by a scope list. */
      var SCOPE = ['Action Planning', 'Standard Work', 'Problem Solving',
                   '5S', 'Daily & Visual Mgmt', 'Operating Cadences'];
      /* "Across pages" is never scoped out. A blocker that gates every fundamental is not
         attached to one, and filtering it away because it lacks a page name is how three
         GE-owned blockers went invisible on this board — the worst outcome available, since
         the board exists to say whose move it is. Problem Solving joins the scope because it
         releases next week and Anam is reviewing it now. */
      if (SCOPE.length) DATA.items = DATA.items.filter(function(i){
        return SCOPE.indexOf(i.page) > -1 || i.page === 'Across pages';
      });
    })
    .then(function(){ boot(); })   // kept apart so a render error is not reported as a fetch error
    .catch(function(e){
      var loaded = !!DATA;
      document.getElementById('list').innerHTML = '<div class="empty">' +
        (loaded ? 'Data loaded, but the page failed to render: ' : 'Could not load data/worklist.json: ') +
        esc(e.message) + '</div>';
      throw e;   // still surface it to the console
    });

  function boot(){
    document.getElementById('eyebrow').textContent = DATA.source || 'Flight Deck';
    var upd = DATA.updated ? parse(DATA.updated) : null;
    document.getElementById('foot').textContent =
      'One file behind this page: data/worklist.json' + (upd ? ' · last updated ' + fmt(upd) : '');
    drawTldr(); drawStats(); drawGates(); drawFilters(); draw();
  }

  function count(fn){ return DATA.items.filter(fn).length; }

  /* Any number the band quotes is counted, never typed. It said eleven items
     sat with GE while the table under it listed fifteen, because the sentence
     was written once and the table is built every time. */
  var COUNTS = {
    ge:       function(){ return open().filter(function(i){ return i.owner === 'GE'; }).length; },
    bttr:     function(){ return open().filter(function(i){ return i.owner !== 'GE'; }).length; },
    open:     function(){ return open().length; },
    ready:    function(){ return DATA.items.filter(function(i){ return i.status === 'shipped'; }).length; }
  };
  function open(){
    return DATA.items.filter(function(i){ return !DONE[i.status]; });
  }
  function fill(text){
    return String(text).replace(/\{(\w+)\}/g, function(all, k){
      return COUNTS[k] ? String(COUNTS[k]()) : all;   // unknown token stays visible
    });
  }

  /* STATUS BULLETS, house rule: 18 to 25 words, one sentence, outcome first then one useful
     detail. Hard ceiling 30 words or three lines. Five to seven bullets, never more.
     Explanation, history and edge cases go behind a link rather than into the bullet — a
     reader scans the opening words and then decides, so at 40-plus words every bullet reads
     equally unimportant. The bullets on this board ran 25 to 48 words before 14 Aug. */
  function drawTldr(){
    var t = DATA.tldr, el = document.getElementById('tldr');
    if (!t || !t.headline){ el.style.display = 'none'; return; }
    /* The band opens standup, so what standup needs to open sits in it.
       New tab deliberately: this renders inside an iframe on the hub. */
    /* A link can carry the date it becomes useful. Pointing standup at Friday's
       deck on Tuesday only invites people to read a half-finished thing, and a
       date on the record beats someone remembering to put the link back. */
    var ready = (t.links || []).filter(function(l){
      return !l.from || days(today, parse(l.from)) <= 0;
    });
    var links = ready.length
      ? '<div class="tlinks">' + ready.map(function(l){
          return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) +
                 (l.meta ? '<span>' + esc(l.meta) + '</span>' : '') + '</a>'; }).join('') + '</div>'
      : '';
    /* The band is what standup opens on, so it is headed with the day standup
       is happening — read from the reader's own clock, not from the file. Built
       from local parts: toISOString would tip the evening of a month end into
       the next day. */
    var DAY = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var MON = ['January','February','March','April','May','June','July','August',
               'September','October','November','December'];
    var n = new Date();
    var stamp = DAY[n.getDay()] + ', ' + n.getDate() + ' ' + MON[n.getMonth()] + ' ' + n.getFullYear();


    el.innerHTML = '<div class="blockhd">' + esc(stamp) + '</div><div class="hl">' + esc(t.headline) + '</div>' +
      ((t.points && t.points.length)
        ? '<ul' + (t.points.length === 3 ? ' class="three"' : '') + '>' + t.points.map(function(p){ var txt=(typeof p==='string')?p:p.text; var url=(typeof p==='string')?'':p.url; var ls=(typeof p==='string')?[]:(p.links||[]); var tail=''; if(ls.length){ tail='<div class="tl-films">'+ls.map(function(l){ return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener"><b>' + esc(l.label) + '</b>' + (l.meta ? '<span>' + esc(l.meta) + '</span>' : '') + '<i>&rarr;</i></a>'; }).join('')+'</div>'; } else if(url){ tail=' <a class="tl-review" href="' + esc(url) + '" target="_blank" rel="noopener">Review &rarr;</a>'; } return '<li>' + esc(fill(txt)) + tail + '</li>'; }).join('') + '</ul>'
        : '') + links;
    drawNext(t.next);
  }

  /* Six dates are a list, not a table: WHEN / STAGE / WHAT headers read as a second
     heading level competing with the card's own, which is what looked broken. */
  function drawNext(next){
    var el = document.getElementById('nwblock');
    if (!el) return;
    if (!next || !next.rows || !next.rows.length){ el.style.display = 'none'; return; }
    el.style.display = '';
    /* Group by day in the order the rows arrive, so a day is named once and its items
       sit under it. Object key order is not safe for this, hence the parallel array. */
    var order = [], byDay = {};
    next.rows.forEach(function(r){
      var k = r.when || '';
      if (!byDay[k]) { byDay[k] = []; order.push(k); }
      byDay[k].push(r);
    });
    el.innerHTML = '<div class="blockhd">' + esc(next.label || 'Next week') + '</div><ul>' +
      order.map(function(k){
        return '<li><b>' + esc(k) + '</b><span class="day">' + byDay[k].map(function(r){
          return '<span>' + esc(r.what || '') + '</span>'; }).join('') +
          '</span></li>'; }).join('') + '</ul>';
  }

  /* Every fix should be one click from the thing it changed. An item names its
     own destination when the fundamental's page is not the best place to land
     — the Excel work opens the plan builder, not the Action Planning page —
     and otherwise falls back to the page it sits under. An item with nowhere
     useful to go stays plain text rather than becoming a link that disappoints.
     The ref stays a label: it is a commit, and GE has no repository to open. */
  function itemHref(r){
    if (r.url) return r.url;
    return PAGE_URL[r.page] || null;
  }
  function itemTitle(r){
    var href = itemHref(r);
    if (!href) return '<div class="it-t">' + esc(r.title) + '</div>';
    return '<a class="it-t it-a" href="' + esc(href) + '" target="_blank" rel="noopener">' +
           esc(r.title) + '<span class="it-go" aria-hidden="true">&nearr;</span></a>';
  }

  function drawStats(){
    var n = { shipped:0, active:0, next:0, blocked:0, sharepoint:0 };
    DATA.items.forEach(function(i){ if (n[i.status] != null) n[i.status]++; });
    // the SharePoint card counts down to the gate that actually does the port
    var spGate = (DATA.gates || []).filter(function(g){ return /sharepoint/i.test(g.label); })[0];
    var spSub = '';
    if (spGate){ var dd = days(today, parse(spGate.date));
      spSub = dd === 0 ? 'ports today' : dd === 1 ? 'ports tomorrow' : dd > 0 ? 'ports in ' + dd + ' days' : ''; }
    // labels come from STATUS so a card and its chip can never disagree
    var lbl = function(k){ return (STATUS.filter(function(x){ return x.k === k; })[0] || {}).label || k; };
    var cards = [
      { cls:'blocked', k:lbl('blocked'),    v:String(n.blocked), sub:'content to come' },
      { cls:'now',     k:lbl('active'),     v:String(n.active),  sub:'' },
      { cls:'ship',    k:lbl('shipped'),    v:String(n.shipped), sub:'live on the preview' },
      { cls:'',        k:lbl('next'),       v:String(n.next),    sub:'' },
      { cls:'',        k:lbl('sharepoint'), v:String(n.sharepoint), sub:spSub }
    ];
    document.getElementById('stats').innerHTML = cards.map(function(c){
      return '<div class="st ' + c.cls + '"><div class="k">' + esc(c.k) + '</div><div class="v">' +
             esc(c.v) + (c.sub ? ' <small>' + esc(c.sub) + '</small>' : '') + '</div></div>';
    }).join('');
  }

  function drawGates(){
    var gates = DATA.gates || [];
    // the next gate is the first one that has not passed
    var nextIdx = -1;
    gates.forEach(function(g,i){ if (nextIdx < 0 && days(today, parse(g.date)) >= 0) nextIdx = i; });
    document.getElementById('gates').innerHTML = gates.map(function(g,i){
      var d = parse(g.date), dd = days(today, d);
      var cls = dd < 0 ? 'past' : (i === nextIdx ? 'next' : '');
      var when = dd === 0 ? 'Today' : dd === 1 ? 'Tomorrow' : dd < 0 ? fmt(d) : fmt(d) + ' · ' + dd + 'd';
      return '<div class="gt ' + cls + '"><div class="d">' + esc(when) + '</div><div class="l">' + esc(g.label) + '</div></div>';
    }).join('');
  }

  function drawFilters(){
    /* A chip with a count of zero can only ever say "nothing matches", so it is
       not offered. The state still exists and still has its own stat card. */
    document.getElementById('f-status').innerHTML =
      STATUS.map(function(st){
        var n = count(function(i){ return i.status === st.k; });
        if (!n) return '';
        return '<button type="button" class="vb' + (fStatus === st.k ? ' on' : '') + '" data-k="' + esc(st.k) + '">' +
               esc(st.label) + ' <span class="n">' + n + '</span></button>';
      }).join('');
  }

  /* Sort. Status is the default and uses pipeline order, not the alphabet.
     Undated rows sort last ascending, so "no date" never reads as "due first". */
  var COLS = [
      { k:'status', label:'Status', cls:'c-status' },
      { k:'item',   label:'Item',   cls:'c-item' },
      { k:'needs',  label:'Needs',  cls:'c-needs' },
      { k:'owner',  label:'Owner',  cls:'c-owner' },
      { k:'due',    label:'Due',    cls:'c-due' }
    ];
  var sortKey = 'status', sortDir = 1;

  function keyOf(r, k){
    if (k === 'status') return ORDER[r.status];
    if (k === 'owner')  return r.owner.toLowerCase();
    if (k === 'due')    return r.due ? parse(r.due).getTime() : Infinity;
    return r.title.toLowerCase();
  }
  function cmp(a, b){
    var x = keyOf(a, sortKey), y = keyOf(b, sortKey);
    // undated always trails, whichever way the column is pointing
    if (sortKey === 'due' && (x === Infinity || y === Infinity)) return x === y ? 0 : (x === Infinity ? 1 : -1);
    if (x < y) return -1 * sortDir;
    if (x > y) return  1 * sortDir;
    return ORDER[a.status] - ORDER[b.status];
  }

  /* Bound once. drawFilters() rewrites the chips on every render, so a listener
     attached inside it accumulates and the toggle fires twice. */
  document.getElementById('f-status').addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.vb') : null;
    if (!btn) return;
    var k = btn.getAttribute('data-k');
    fStatus = (fStatus === k) ? 'all' : k;   // clicking the active chip clears it
    drawFilters(); draw();
  });

  function draw(){
    var items = DATA.items.filter(function(i){
      return fStatus === 'all' || i.status === fStatus;
    });
    if (!items.length){ document.getElementById('list').innerHTML = '<div class="empty">Nothing matches that filter.</div>'; return; }

    var pages = [];
    DATA.items.forEach(function(i){ if (pages.indexOf(i.page) < 0) pages.push(i.page); });
    var WHAT = {
      'Action Planning': 'everything open on this fundamental',
      'Standard Work':   'everything open on this fundamental',
      'Problem Solving': 'everything open on this fundamental',
      'Across pages':    'applies to all eight fundamentals'
    };

    var head = '<thead><tr>' + COLS.map(function(c){
      return '<th class="' + c.cls + (sortKey === c.k ? ' on' : '') + '" data-k="' + c.k + '">' +
             esc(c.label) + '<span class="ar">' + (sortDir > 0 ? '\u25B2' : '\u25BC') + '</span></th>';
    }).join('') + '</tr></thead>';

    document.getElementById('list').innerHTML = pages.map(function(pg){
      var rows = items.filter(function(i){ return i.page === pg; }).sort(cmp);
      if (!rows.length) return '';
      var open = rows.filter(function(r){ return !DONE[r.status]; }).length;
      var label = (STATUS.filter(function(x){ return x.k === fStatus; })[0] || {}).label;
      var heading = PAGE_URL[pg]
        ? '<a class="gh-link" href="' + PAGE_URL[pg] + '" target="_blank" rel="noopener"><b>' + esc(pg) + '</b></a>'
        : '<b>' + esc(pg) + '</b>';
      return '<div class="grp"><div class="gh">' + heading +
             '<span class="gs">' + esc(WHAT[pg] || '') + '</span>' +
             '<span class="ct">' +
             (fStatus !== 'all' ? rows.length + ' ' + esc(label)
                : open ? open + ' of ' + rows.length + ' open'
                       : 'all ' + rows.length + ' done') + '</span></div>' +
        '<table class="wl">' + head + '<tbody>' + rows.map(function(r){
          var due = DONE[r.status] ? '<span class="due done">Done</span>'
                                   : '<span class="due none">&mdash;</span>';
          if (r.due && !DONE[r.status]){
            var d = parse(r.due), dd = days(today, d);
            due = '<span class="due' + (dd >= 0 && dd <= 2 ? ' soon' : '') + '">' +
                  (dd === 0 ? 'Today' : dd === 1 ? 'Tomorrow' : fmtShort(d)) + '</span>';
          }
          var st = (STATUS.filter(function(x){ return x.k === r.status; })[0] || {}).label || r.status;
          return '<tr' + (DONE[r.status] ? ' class="done"' : '') + '>' +
            '<td class="c-status"><span class="pill p-' + esc(r.status) + '">' + esc(st) + '</span></td>' +
            '<td>' + itemTitle(r) +
              (r.note || r.ref ? '<div class="it-n">' + (r.note ? esc(r.note) : '') +
                (r.ref ? '<span class="ref">' + esc(r.ref) + '</span>' : '') + '</div>' : '') + '</td>' +
            '<td class="c-needs">' + (r.needs ? '<span class="needs">' + esc(r.needs) + '</span>' : '<span class="needs-none">Nothing</span>') + '</td>' +
        '<td class="c-owner"><span class="own' + (r.owner === 'GE' ? ' ge' : '') + '">' + esc(r.owner) + '</span></td>' +
            '<td class="c-due">' + due + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }).join('');
  }

  // one delegated handler; draw() replaces the headers on every render
  document.getElementById('list').addEventListener('click', function(e){
    var th = e.target.closest ? e.target.closest('th[data-k]') : null;
    if (!th) return;
    var k = th.getAttribute('data-k');
    if (k === sortKey) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
    draw();
  });
})();
</script>
</body>
</html>
