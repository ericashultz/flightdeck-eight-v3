<style>
  /* GE Aerospace brand: Atmosphere Blue ground, Sky Blue accent,
     Avionics Green highlight, GE Sons type — tokens from geaerospace.com */
  @font-face{font-family:"GE Sans";font-weight:300;src:url("assets/fonts/ge-sans/sons-light.woff2") format("woff2");font-display:block}
  @font-face{font-family:"GE Sans";font-weight:400;src:url("assets/fonts/ge-sans/sons-regular.woff2") format("woff2");font-display:block}
  @font-face{font-family:"GE Sans";font-weight:600;src:url("assets/fonts/ge-sans/sons-semibold.woff2") format("woff2");font-display:block}
  @font-face{font-family:"GE Sans";font-weight:300;font-style:italic;src:url("assets/fonts/ge-sans/sons-light-italic.woff2") format("woff2");font-display:block}
  @font-face{font-family:"GE Sans";font-weight:400;font-style:italic;src:url("assets/fonts/ge-sans/sons-regular-italic.woff2") format("woff2");font-display:block}
  @font-face{font-family:"GE Sans";font-weight:600;font-style:italic;src:url("assets/fonts/ge-sans/sons-semibold-italic.woff2") format("woff2");font-display:block}
  :root{
    --blue:#4181ff; --paper:#f6f8fd; --muted:#8ea6ff; --green:#0ad64f;
    --void:#00003d; --line:rgba(255,255,255,.14);
    --mono:"GE Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;
    --sans:"GE Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{font-family:var(--sans);color:#00003d;margin:0}

  #shell{padding:44px 0 0}
  #screenwrap{position:relative;margin:0 auto;width:min(1760px,calc(100vw - 112px))}

  /* ---------- camera rig ----------
     The frame is the FULL height of the page and nothing scrolls; the camera
     does every move. That keeps getBoundingClientRect absolute and exact.
     Every shot is >= 1:1, so the page always fills the frame — you are looking
     at the product, not at a screenshot of it. ---------- */
  #stage{width:1440px;height:900px;position:absolute;top:0;left:0;overflow:hidden;background:var(--void);contain:layout paint;
    transform-origin:top left;border-radius:10px;
    box-shadow:0 6px 18px rgba(11,26,64,.10),0 44px 110px -32px rgba(11,26,64,.38)}
  #cam{position:absolute;top:0;left:0;transform-origin:0 0;
    transition:transform 1.3s cubic-bezier(.32,.72,.24,1);will-change:transform}
  #frame{width:1440px;border:0;display:block;background:var(--paper);-webkit-backface-visibility:hidden;backface-visibility:hidden}

  /* ---------- lower third ---------- */
  #below{position:relative;margin:0 auto;height:330px}
  #cap{position:absolute;left:0;right:0;top:38px;
    opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .45s cubic-bezier(.32,.72,.24,1),transform .45s cubic-bezier(.32,.72,.24,1)}
  #controls{position:absolute;top:38px;right:0;display:flex;justify-content:flex-end;gap:12px;
    opacity:0;pointer-events:none;z-index:30;transition:opacity .3s ease}
  body.running #controls,body.ended #controls{opacity:1;pointer-events:auto}
  #controls button{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;
    border:0;background:rgba(0,0,61,.08);color:#00003d;cursor:pointer;
    font-family:var(--sans);font-size:15px;transition:background .15s}
  #controls button:hover{background:rgba(0,0,61,.16)}
  #more{position:relative;height:52px}
  #menu{position:absolute;bottom:62px;right:0;display:none;min-width:225px;background:#fff;
    border-radius:12px;padding:8px;box-shadow:0 6px 18px rgba(11,26,64,.12),0 24px 60px -18px rgba(11,26,64,.35)}
  #menu.open{display:block}
  #menu button,#menu a{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
    font-family:var(--sans);font-weight:400;font-size:16px;color:#00003d;text-decoration:none;
    padding:11px 14px;border-radius:8px}
  #menu button:hover,#menu a:hover{background:rgba(0,0,61,.06)}
  #cap.in{opacity:1;transform:none}
  #cap .eye{font-family:var(--sans);font-weight:400;font-size:18px;color:#7c88ad;display:block;margin-bottom:8px}
  #cap .line{font-family:var(--sans);font-size:46px;line-height:1.15;font-weight:400;
    letter-spacing:-.03em;color:#00003d;max-width:28ch}


  /* ---------- title + end cards ---------- */
  .card{position:absolute;inset:-1px;color:#fff;z-index:60;display:grid;place-items:center;
    background:radial-gradient(120% 150% at 50% -20%,rgba(65,129,255,.26),transparent 55%),var(--void);
    opacity:0;pointer-events:none;transition:opacity .7s ease}
  .card.in{opacity:1}
  .card .inner{text-align:center;padding:0 40px}
  .card .eye{font-family:var(--sans);font-weight:400;font-size:20px;color:var(--muted);margin-bottom:18px}
  .card h1{font-size:64px;line-height:1.05;font-weight:400;letter-spacing:-.03em}
  .card p{margin-top:20px;font-size:19px;color:rgba(255,255,255,.62);
    max-width:46ch;margin-left:auto;margin-right:auto;line-height:1.5}

  /* ---------- cursor ---------- */
  #cursor{position:absolute;left:0;top:0;z-index:45;width:26px;height:26px;
    opacity:0;pointer-events:none;
    transition:transform .95s cubic-bezier(.4,.1,.2,1),opacity .3s ease;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
  #cursor.on{opacity:1}
  #cursor svg{display:block;width:100%;height:100%}
  #cursor .ring{position:absolute;left:-9px;top:-9px;width:44px;height:44px;
    border-radius:50%;border:2px solid rgba(65,129,255,.9);opacity:0;transform:scale(.4)}
  #cursor.click .ring{animation:cur-pulse .5s ease-out}
  @keyframes cur-pulse{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.15)}}

  /* ---------- chrome ---------- */
  #scrub{position:absolute;top:0;left:0;right:0;height:16px;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .3s ease}
  body.running #scrub,body.ended #scrub{opacity:1;pointer-events:auto}
  #scrub::before{content:"";position:absolute;top:7px;left:0;right:0;height:3px;
    background:rgba(0,0,61,.12);border-radius:2px}
  #scrub-fill{position:absolute;top:7px;left:0;height:3px;width:0;background:var(--blue);border-radius:2px;
    transition:width .28s linear}
  #scrub.dragging #scrub-fill{transition:none}
  #scrub-knob{position:absolute;top:2px;left:0;width:13px;height:13px;border-radius:50%;
    background:#00003d;margin-left:-6px;opacity:0;transition:left .28s linear,opacity .15s}
  #scrub.dragging #scrub-knob{transition:opacity .15s}
  #scrub:hover #scrub-knob{opacity:1}
  #replay{position:absolute;bottom:26px;right:28px;z-index:70;font-family:var(--sans);font-weight:400;
    font-size:14px;color:rgba(255,255,255,.75);background:rgba(255,255,255,.08);
    border:0;border-radius:100px;padding:10px 20px;cursor:pointer;opacity:0;
    transition:.2s;pointer-events:none}
  #replay.show{opacity:1;pointer-events:auto}
  #replay:hover{color:#fff;border-color:rgba(255,255,255,.4)}

  #playrow{margin-top:38px;display:flex;gap:16px;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .4s ease}
  .gbtn{display:inline-flex;align-items:center;gap:14px;font-family:var(--sans);font-weight:400;
    font-size:18px;color:#fff;border:0;border-radius:100px;cursor:pointer;
    padding:8px 10px 8px 24px;transition:background .18s,color .18s;text-decoration:none}
  .gbtn i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;
    font-style:normal;font-size:13px;transition:background .18s,color .18s}
  .gbtn.gp{background:rgba(255,255,255,.1)}
  .gbtn.gp i{background:#fff;color:#00003d}
  .gbtn.gp:hover{background:#fff;color:#00003d}
  .gbtn.gs{background:transparent}
  .gbtn.gs i{background:rgba(255,255,255,.3);color:#fff}
  .gbtn.gs:hover i{background:rgba(255,255,255,.5)}
  #playrow.ready{opacity:1;pointer-events:auto}
  #explore{margin-top:36px;pointer-events:none}
  #watch{pointer-events:none}
  .card.in #watch{pointer-events:auto}
  .card.in #explore{pointer-events:auto}

  #explore:hover{background:#dfe6f3}
  #play:hover{background:#dfe6f3}

  #editorial{position:absolute;left:0;right:0;top:20px;
    opacity:0;pointer-events:none;transition:opacity .45s ease}
  #editorial h2{margin-top:0}
  body.ended #editorial{opacity:1;pointer-events:auto}
  #editorial h2{font-family:var(--sans);font-weight:400;font-size:46px;letter-spacing:-.03em;color:#00003d;margin:0 0 18px}
  #editorial p{font-family:var(--sans);font-weight:400;font-size:18px;line-height:1.45;color:#4A506A;max-width:62ch;margin:0 0 34px}
  #editorial .cta{display:inline-flex;align-items:center;gap:14px;font-family:var(--sans);font-weight:400;
    font-size:18px;color:#00003d;background:rgba(0,0,61,.08);border-radius:100px;
    padding:10px 12px 10px 24px;text-decoration:none;transition:background .15s}
  #editorial .cta:hover{background:rgba(0,0,61,.16)}
  #editorial .cta i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
    background:#00003d;color:#fff;font-style:normal;font-size:16px}
  #title{place-items:stretch}
  .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,1,15,.26) 55%,rgba(0,1,15,.44))}
  .hero-copy{position:relative;align-self:end;padding:0 66px 52px;max-width:1240px}
  .hero-copy h1{font-size:97px;line-height:90px;font-weight:400;letter-spacing:-2.91px;margin:0 0 18px;color:#fff}
  #watch{display:inline-flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;padding:0}
  #watch span{font-family:var(--sans);font-weight:400;font-size:97px;color:rgba(255,255,255,.6);letter-spacing:-2.08px}
  #watch i{display:grid;place-items:center;width:83px;height:83px;border-radius:50%;
    background:rgba(255,255,255,.3);
    color:#fff;font-style:normal;font-size:30px;padding-left:7px;transition:background .18s,transform .18s}
  #watch:hover i{background:rgba(255,255,255,.45);transform:scale(1.05)}
    cursor:pointer;padding:0;background:#0a1330;text-align:left;transition:transform .2s}
    background:rgba(255,255,255,.28);color:#fff;font-style:normal;font-size:15px}
  body.noanim #cam,body.noanim #cursor,body.noanim #cap{transition:none}
</style>

<script>
(function(){
  var cam    = document.getElementById('cam');
  var frame  = document.getElementById('frame');
  var cap    = document.getElementById('cap');
  var capEye = cap.querySelector('.eye');
  var capLine= cap.querySelector('.line');
  var title  = document.getElementById('title');
  var endc   = document.getElementById('end');
  var prog   = document.getElementById('scrub-fill');
  var knob   = document.getElementById('scrub-knob');
  var scrubEl = document.getElementById('scrub');
  var replay = document.getElementById('replay');

  var STAGE_W = 1440, STAGE_H = 900;
  // The stage IS the film: scale it to the window like a video player.
  function fitStage(){
    var wrap = document.getElementById('screenwrap');
    // Fit width, keep room under the player for the caption line.
    var s = Math.min((window.innerWidth - 112) / STAGE_W,
                     (window.innerHeight - 320) / STAGE_H);
    var ph = Math.round(STAGE_H * s);
    wrap.style.width  = Math.round(STAGE_W * s) + 'px';
    wrap.style.height = ph + 'px';
    var below = document.getElementById('below');
    if (below) below.style.width = Math.round(STAGE_W * s) + 'px';
    // centre the player in the viewport (biased slightly high so the
    // caption zone below reads as part of the composition)
    var pad = Math.max(28, Math.round((window.innerHeight - ph) / 2) - 70);
    document.getElementById('shell').style.paddingTop = pad + 'px';
    document.getElementById('stage').style.transform = 'scale(' + s.toFixed(4) + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();
  var timers = [], RUN = 0, DUR = 119000, fullH = 900;

  var params = new URLSearchParams(location.search);
  if (params.get('noanim') === '1') document.body.classList.add('noanim');

  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function clearAll(){ timers.forEach(clearTimeout); timers = []; }
  function doc(){ try { return frame.contentDocument; } catch(e){ return null; } }
  function win(){ try { return frame.contentWindow; } catch(e){ return null; } }

  /* ---------- camera ---------- */
  function frameTo(cx, cy, s){
    s = Math.max(1, s || 1);
    var tx = (STAGE_W / 2) - cx * s;
    var ty = (STAGE_H / 2) - cy * s;
    var pw = 1440 * s, ph = (parseFloat(frame.style.height) || 900) * s;
    tx = pw >= STAGE_W ? Math.min(0, Math.max(STAGE_W - pw, tx)) : (STAGE_W - pw) / 2;
    ty = ph >= STAGE_H ? Math.min(0, Math.max(STAGE_H - ph, ty)) : (STAGE_H - ph) / 2;
    cam.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + s + ')';
  }
  function wide(){ frameTo(STAGE_W / 2, 450, 1); }

  // Tall bands: frame from the TOP (header first), not the vertical centre.
  function pushTop(sel, scale, headroom){
    var d = doc(); if (!d) return wide();
    var el = d.querySelector(sel);
    if (!el || !el.getClientRects().length) return wide();
    var r = el.getBoundingClientRect();
    var s = Math.max(1, scale || 1);
    frameTo(r.left + r.width / 2, r.top - (headroom == null ? 120 : headroom) + (STAGE_H / 2) / s, s);
  }
  function pushTo(sel, scale, yNudge){
    var d = doc(); if (!d) return wide();
    var el = d.querySelector(sel);
    if (!el || !el.getClientRects().length) return wide();
    var r = el.getBoundingClientRect();
    frameTo(r.left + r.width / 2, r.top + r.height / 2 + (yNudge || 0), scale);
  }

  /* ---------- cursor ----------
     Rides the same coordinate system as the camera: page point -> screen is
     p*s + t, read from the camera's TARGET transform so the cursor can start
     gliding while the camera is still in flight. ---------- */
  var cursor = document.getElementById('cursor');
  function camXf(){
    var m = /translate\((-?[\d.]+)px,(-?[\d.]+)px\) scale\(([\d.]+)\)/.exec(cam.style.transform || '');
    return m ? { tx:+m[1], ty:+m[2], s:+m[3] } : { tx:0, ty:0, s:1 };
  }
  function cursorTo(sel){
    var d = doc(); if (!d) return;
    var el = d.querySelector(sel);
    if (!el || !el.getClientRects().length) return;
    var r = el.getBoundingClientRect(), x = camXf();
    var px = (r.left + r.width  / 2) * x.s + x.tx;
    var py = (r.top  + r.height / 2) * x.s + x.ty;
    cursor.classList.add('on');
    cursor.style.transform = 'translate(' + (px - 3).toFixed(0) + 'px,' + (py - 2).toFixed(0) + 'px)';
  }
  function cursorClick(sel, fn){
    cursor.classList.remove('click'); void cursor.offsetWidth;
    cursor.classList.add('click');
    if (fn) fn(); else click(sel);
  }
  function cursorHide(){ cursor.classList.remove('on'); }

  /* ---------- frame sizing ----------
     Normal mode: frame grows to full content height, camera pans over it.
     Modal mode:  the page's modals are position:fixed/inset:0, so they fill the
     FRAME's viewport. Collapse the frame to 900 first or the modal renders
     centred in a 6000px box and lands mostly off-camera. ---------- */
  function fitFrame(){
    var d = doc(); if (!d) return 900;
    var h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
    // Cap the painted layer: the camera never travels below this, and Safari
    // re-rasterizes the whole frame on every zoom — size is the chop.
    h = Math.min(h, 4000);
    fullH = h; frame.style.height = h + 'px';
    return h;
  }
  function modalMode(on){
    if (on){ frame.style.height = STAGE_H + 'px'; cam.style.transform = 'translate(0px,0px) scale(1)'; }
    else   { fitFrame(); }
  }

  /* ---------- captions ---------- */
  function say(eye, line){
    // Eyebrows retired — the headline carries it alone.
    cap.classList.remove('in');
    at(260, function(){ capEye.textContent = ''; capLine.textContent = line; cap.classList.add('in'); });
  }
  function hush(){
    // Quiet stretches show the film's title below the player, not empty space.
    cap.classList.remove('in');
    at(320, function(){
      capEye.textContent = '';
      capLine.textContent = 'FLIGHT DECK Universal Template';
      cap.classList.add('in');
    });
  }

  /* ---------- reach into the live page ---------- */
  function call(fn){
    var w = win(), args = [].slice.call(arguments, 1);
    try { if (w && typeof w[fn] === 'function') w[fn].apply(w, args); } catch(e){}
  }
  function click(sel){
    var d = doc(); if (!d) return;
    var el = d.querySelector(sel);
    if (el) { try { el.click(); } catch(e){} }
  }

  /* The page is reveal-on-click: #sw-b carries qs-* classes that flip each
     [data-qs] band to display:block, and data-work picks which step tree is
     live. Open the band first, let it lay out, then frame it. */
  function swb(){ var d = doc(); return d && d.getElementById('sw-b'); }
  function reveal(cls){ var b = swb(); if (b && cls) b.classList.add(cls); }

  // Steps only exist in the first-time journey:
  //   #sw-b:not([data-state="new"]) .step{display:none}
  // so the guided walkthrough has to be switched on before framing any step.
  function guided(on){
    var b = swb(); if (b) b.setAttribute('data-state', on ? 'new' : 'default');
  }

  // Steps are progressively disclosed — open the whole tree the way the
  // export pipeline does, so nothing is framed half-collapsed.
  function workType(w){
    var b = swb(), d = doc(); if (!b || !d) return;
    b.setAttribute('data-work', w);
    d.querySelectorAll('.path-tree[data-work="' + w + '"] .step')
     .forEach(function(s){ s.classList.add('revealed', 'advanced'); });
  }

  // reveal → relayout → frame, as one move
  function open(cls, sel, scale, delay){
    reveal(cls);
    at(delay || 420, function(){ fitFrame(); pushTo(sel, scale); });
  }

  /* ---------- the beat sheet ----------
     The template detail page, top to bottom, on the Universal Template: the entry that fills
     every field a detail page supports. No voiceover. Every caption is the page's own words:
     its section headings, its button label, and the name the Universal Template gives its lead. */
  var BEATS = [
    [0, function(){ wide(); say('', 'FLIGHT DECK Universal Template'); }],
    [3600, function(){ say('', 'The lead'); pushTo('#t-lead', 1.35); }],
    [8000, function(){ say('', 'Download template'); pushTo('.aside', 1.0); at(900, function(){ cursorTo('#t-dl'); }); }],
    [12400, function(){ pushTo('#t-files', 1.35); at(900, function(){ cursorTo('#t-miro'); }); }],
    [16400, function(){ cursorHide(); say('', 'What good looks like'); pushTo('#s-worked', 1.35); }],
    [20800, function(){ say('', 'What is inside'); pushTop('#t-inside', 1.15, 150); }],
    [26000, function(){ say('', 'How to fill it in'); pushTo('#s-steps', 1.3); }],
    [31000, function(){ say('', 'Related templates'); pushTo('#t-related', 1.3); at(1200, function(){ cursorTo('#t-related a'); }); }],
    [36000, function(){ cursorHide(); hush(); wide(); }],
    [38400, function(){
      cap.classList.remove('in');
      cursorHide();
      endc.classList.add('in');
      replay.classList.add('show');
      document.body.classList.remove('running');
      document.body.classList.add('ended');
    }]
  ];

  /* Silent mode: same beats, tighter clock — narration gaps capped at reading pace. */
  var SILENT = (function(){
    var out = [], prev = 0, mapped = 0, MAX = 4200;
    BEATS.forEach(function(b, i){
      if (i === 0){ mapped = b[0]; }
      else { mapped += Math.min(b[0] - prev, MAX); }
      prev = b[0];
      out.push([mapped, b[1]]);
    });
    return { beats: out, dur: mapped + 9700 };
  })();

  /* ---------- runner ---------- */
  var paused = false, runStart = 0, pauseElapsed = 0, runIsVo = false;
  var pauseFn = null, resumeFn = null;
  function start(off){
    off = off || 0;
    var me = ++RUN;
    paused = false; pauseElapsed = 0;
    clearAll();
    title.classList.remove('in');
    endc.classList.remove('in');
        watchBtn.style.display = 'none';
    replay.classList.remove('show');
    hush();
    // reset the page under the camera so replay is deterministic
    cursorHide();
    try { win().scrollTo(0, 0); } catch(e){}
    fitFrame();
    wide();

    document.body.classList.remove('ended');
    document.body.classList.add('running');
    try { voAudio.pause(); voAudio.currentTime = 0; if (useVo) voAudio.play(); } catch(e){}
    cursor.classList.add('on');
    cursor.style.transform = 'translate(880px, 520px)';

    var LIST = useVo ? BEATS : SILENT.beats;
    var RUNDUR = useVo ? DUR : SILENT.dur;
    runIsVo = useVo;
    function sched(off){
      LIST.forEach(function(b){
        if (b[0] >= off) at(b[0] - off, function(){ if (me === RUN) b[1](); });
      });
    }
    if (off > 0){
      // seek: replay everything up to the target instantly, animations off
      document.body.classList.add('noanim');
      LIST.forEach(function(b){ if (b[0] < off){ try { b[1](); } catch(err){} } });
      at(200, function(){ document.body.classList.remove('noanim'); });
      try { voAudio.currentTime = off / 1000; if (useVo) voAudio.play(); } catch(err){}
    }
    runStart = Date.now() - off;
    sched(off);

    var iv = setInterval(function(){
      if (me !== RUN) return clearInterval(iv);
      var e = paused ? pauseElapsed : (Date.now() - runStart);
      var pct = Math.min(100, (e / RUNDUR) * 100) + '%';
      prog.style.width = pct;
      knob.style.left = pct;
      if (e >= RUNDUR) clearInterval(iv);
    }, 250);

    pauseFn = function(){
      if (paused || me !== RUN) return;
      paused = true;
      pauseElapsed = Date.now() - runStart;
      clearAll();
      try { voAudio.pause(); } catch(err){}
      pauseBtn.innerHTML = '&#9654;';
      pauseBtn.setAttribute('aria-label', 'Resume');
    };
    resumeFn = function(){
      if (!paused || me !== RUN) return;
      paused = false;
      runStart = Date.now() - pauseElapsed;
      sched(pauseElapsed + 1);
      try { if (useVo) voAudio.play(); } catch(err){}
      pauseBtn.innerHTML = '&#10074;&#10074;';
      pauseBtn.setAttribute('aria-label', 'Pause');
    };
    pauseBtn.innerHTML = '&#10074;&#10074;';
  }

  // options menu: opens on hover or click, closes on a grace timer — no hover-gap trap
  var moreWrap = document.getElementById('more');
  var menuEl = document.getElementById('menu');
  var menuCloseT = null;
  function menuOpen(){ clearTimeout(menuCloseT); menuEl.classList.add('open'); }
  function menuClose(){ menuCloseT = setTimeout(function(){ menuEl.classList.remove('open'); }, 350); }
  moreWrap.addEventListener('mouseenter', menuOpen);
  moreWrap.addEventListener('mouseleave', menuClose);
  document.getElementById('morebtn').addEventListener('click', function(){
    menuEl.classList.contains('open') ? menuEl.classList.remove('open') : menuOpen();
  });

  // options menu: live VO toggle, back to the cover
  document.getElementById('m-home').addEventListener('click', function(){
    RUN++;                       // kills every scheduled beat
    clearAll();
    paused = false;
    try { voAudio.pause(); voAudio.currentTime = 0; } catch(e){}
    document.body.classList.remove('running', 'choosing', 'ended');
    hushNow();
    endc.classList.remove('in');
        replay.classList.remove('show');
    cursorHide();
    prog.style.width = '0';
    // reset the page under the camera, then show the cover again
    modalMode(false);
    wide();
    watchBtn.style.display = '';
    title.classList.add('in');
  });
  function hushNow(){ cap.classList.remove('in'); }

  // scrubbing: preview while dragging, seek on release
  var scrubbing = false;
  function scrubFrac(e){
    var r = scrubEl.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  }
  function scrubPreview(f){
    var pct = (f * 100) + '%';
    prog.style.width = pct;
    knob.style.left = pct;
  }
  scrubEl.addEventListener('pointerdown', function(e){
    scrubbing = true;
    scrubEl.classList.add('dragging');
    scrubEl.setPointerCapture(e.pointerId);
    scrubPreview(scrubFrac(e));
  });
  scrubEl.addEventListener('pointermove', function(e){
    if (scrubbing) scrubPreview(scrubFrac(e));
  });
  scrubEl.addEventListener('pointerup', function(e){
    if (!scrubbing) return;
    scrubbing = false;
    scrubEl.classList.remove('dragging');
    var target = Math.round(scrubFrac(e) * (useVo ? DUR : SILENT.dur));
    start(Math.min(target, (useVo ? DUR : SILENT.dur) - 1500));
  });

  var pauseBtn = document.getElementById('pausebtn');
  pauseBtn.addEventListener('click', function(){ (paused ? resumeFn : pauseFn) && (paused ? resumeFn() : pauseFn()); });
  document.getElementById('restartbtn').addEventListener('click', function(){ prog.style.width = '0'; start(); });

  var watchBtn = document.getElementById('watch');
  var voAudio = { play:function(){}, pause:function(){}, currentTime:0 };
  var useVo = false, frameReady = false, wantStart = false;
  watchBtn.addEventListener('click', function(){
    watchBtn.style.display = 'none';
    if (frameReady) start(); else wantStart = true;
  });

  replay.addEventListener('click', function(){ prog.style.width = '0'; start(); });

  // Hook for the capture pipeline: deterministic restart + selector audit.
  window.__demo = {
    start: function(){ prog.style.width = '0'; start(); },
    audit: function(){
      var d = doc(), out = {};
      ['#t-lead','#t-dl','#t-files','#t-miro','#s-worked','#t-inside','#s-steps','#t-related']
        .forEach(function(s){
          var el = d && d.querySelector(s);
          out[s] = !el ? 'MISSING' : (el.getClientRects().length ? 'ok' : 'hidden');
        });
      out._frameH = frame.style.height;
      return out;
    }
  };

  frame.addEventListener('load', function(){
    var d = doc();
    if (d) {
      var s = d.createElement('style');
      // Show the page as GE will see it — hide nothing but the scrollbars.
      s.textContent = '::-webkit-scrollbar{width:0;height:0}';
      d.head.appendChild(s);
      // The page's own openers call scrollIntoView, which scrolls the camera's
      // overflow-hidden stage across the frame boundary and silently offsets
      // every shot after it. The camera owns all movement — disable it.
      try { d.defaultView.Element.prototype.scrollIntoView = function(){}; } catch(e){}
    }
    at(350,  fitFrame);   // once fonts and images have settled
    frameReady = true;
    if (wantStart) { wantStart = false; at(400, start); }
  });

  // Load only after the unlock flag is in place.
  frame.src = 'deliverables/standard-work/sw-template-detail.html?t=FLIGHT%20DECK%20Universal%20Template';
})();
</script>
