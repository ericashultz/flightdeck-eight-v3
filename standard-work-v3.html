<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Standard Work before and after &middot; two options &middot; Activation Hub</title>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
@font-face{font-family:"GE Sans";src:url(/assets/fonts/ge-sans/sons-regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:"GE Sans";src:url(/assets/fonts/ge-sans/sons-light.woff2) format("woff2");font-weight:300}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#04070f;color:#fff;font-family:"GE Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 20px 44px;gap:0}
.eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8aa6f0;margin-bottom:12px}
h1{font-size:clamp(24px,3vw,34px);font-weight:300;letter-spacing:-.02em;margin-bottom:26px;text-align:center}
/* Two cuts of the same film, shown as two tiles with a frame from each, so the
   choice is two things to look at rather than a control to operate. */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:min(1240px,96vw);margin-bottom:28px}
.opts button{font:inherit;text-align:left;cursor:pointer;color:#fff;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:0;overflow:hidden;display:block;
  transition:background .2s cubic-bezier(.23,1,.32,1),border-color .2s cubic-bezier(.23,1,.32,1)}
.opts .oshot{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;
  border-bottom:1px solid rgba(255,255,255,.12)}
.opts .obody{display:grid;gap:7px;padding:22px 26px 26px}
.opts .ot{font-size:clamp(24px,2.6vw,34px);font-weight:300;letter-spacing:-.02em;line-height:1.05}
.opts .os{font-size:14px;line-height:1.5;color:rgba(255,255,255,.62)}
.opts button[aria-pressed="true"]{background:#fff;border-color:#fff;color:#04070f}
.opts button[aria-pressed="true"] .os{color:rgba(4,7,15,.62)}
.opts button[aria-pressed="true"] .oshot{border-bottom-color:rgba(4,7,15,.12)}
@media(hover:hover) and (pointer:fine){
  .opts button:not([aria-pressed="true"]):hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.36)}}
@media(max-width:720px){.opts{grid-template-columns:1fr}}
video{width:min(1240px,96vw);aspect-ratio:16/9;border-radius:14px;box-shadow:0 40px 120px -40px rgba(0,0,0,.9);background:#000}
video[hidden]{display:none}
.note{margin-top:16px;font-size:13px;color:rgba(255,255,255,.5)}
.row{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.row a{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:13.5px;border:1px solid rgba(255,255,255,.22);border-radius:100px;padding:10px 20px;transition:border-color .18s cubic-bezier(.23,1,.32,1)}
.row a:hover{border-color:#0ad64f}
.row a.live{background:#16b364;border-color:#16b364}
</style></head><body>
<div class="eyebrow">Standard Work</div>
<h1>Before and after, two options</h1>
<div class="opts" role="group" aria-label="Choose a cut">
  <button type="button" id="btn-a" aria-pressed="true" aria-controls="v-a">
    <img class="oshot" src="/assets/video/standard-work-v3-poster.jpg?v=8e0fed87" alt="">
    <span class="obody"><span class="ot">Option A</span>
    <span class="os">39 sec &middot; the page held in a frame, titles on a panel beside it</span></span>
  </button>
  <button type="button" id="btn-b" aria-pressed="false" aria-controls="v-b">
    <img class="oshot" src="/assets/video/standard-work-v3-b-poster.jpg?v=5ae6bb70" alt="">
    <span class="obody"><span class="ot">Option B</span>
    <span class="os">47 sec &middot; the page full width, titles across the bottom</span></span>
  </button>
</div>
<video id="v-a" src="/assets/video/standard-work-v3.mp4?v=8e0fed87" poster="/assets/video/standard-work-v3-poster.jpg?v=8e0fed87" controls playsinline preload="auto"></video>
<video id="v-b" src="/assets/video/standard-work-v3-b.mp4?v=5ae6bb70" poster="/assets/video/standard-work-v3-b-poster.jpg?v=5ae6bb70" controls playsinline preload="none" hidden></video>
<div class="row">
  <a href="/index.html">Back to the hub</a>
  <a id="dl" href="/assets/video/standard-work-v3.mp4?v=8e0fed87" download onclick="va('event',{name:'sw_v3_mp4'})">Download MP4</a>
  <a href="/assets/video/standard-work-v3.gif?v=14413a3d" download onclick="va('event',{name:'sw_v3_gif'})">Download GIF</a>
  <a class="live" href="/deliverables/standard-work/sw-concept-hybrid.1.html" onclick="va('event',{name:'sw_v3_open_hub'})">Open Standard Work &rarr;</a>
</div>
<script>
(function(){
  var a=document.getElementById('v-a'), b=document.getElementById('v-b');
  var ba=document.getElementById('btn-a'), bb=document.getElementById('btn-b');
  var dl=document.getElementById('dl');
  function show(which){
    var on = which==='a' ? a : b, off = which==='a' ? b : a;
    off.pause(); off.hidden=true;
    on.hidden=false; on.preload='auto';
    ba.setAttribute('aria-pressed', which==='a' ? 'true':'false');
    bb.setAttribute('aria-pressed', which==='b' ? 'true':'false');
    dl.setAttribute('href', on.getAttribute('src'));
    va('event',{name:'sw_v3_option_'+which});
    var p=on.play(); if(p&&p.catch) p.catch(function(){});
  }
  ba.addEventListener('click',function(){ show('a'); });
  bb.addEventListener('click',function(){ show('b'); });
  [a,b].forEach(function(v,i){
    var tag = i===0 ? 'a' : 'b', played=false, done=false;
    v.addEventListener('play',function(){ if(!played){played=true;va('event',{name:'sw_v3_play_'+tag});} });
    v.addEventListener('ended',function(){ if(!done){done=true;va('event',{name:'sw_v3_complete_'+tag});} });
  });
})();
</script>
</body></html>
